name: Everthread mobile build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: everthread-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import an uploaded Everthread source bundle
        id: source
        shell: bash
        run: |
          set -euo pipefail

          if [ -f everthread-source.zip ]; then
            echo "Everthread overlay bundle found. Importing it..."
            IMPORT_DIR="$RUNNER_TEMP/everthread-import"
            rm -rf "$IMPORT_DIR"
            mkdir -p "$IMPORT_DIR"

            # Reject absolute paths and parent traversal before extraction.
            if zipinfo -1 everthread-source.zip | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
              echo "Unsafe path detected in everthread-source.zip."
              exit 1
            fi

            unzip -q everthread-source.zip -d "$IMPORT_DIR"

            if [ ! -f "$IMPORT_DIR/everthread-patch.json" ]; then
              echo "The uploaded ZIP is not an Everthread overlay bundle: everthread-patch.json is missing."
              exit 1
            fi

            FORMAT="$(python3 -c 'import json; print(json.load(open("'"$IMPORT_DIR"'/everthread-patch.json"))["format"])')"
            if [ "$FORMAT" != "1" ]; then
              echo "Unsupported Everthread patch format: $FORMAT"
              exit 1
            fi

            # Overlay changed/new files only. Existing unrelated repository files remain untouched.
            rsync -a \
              --exclude='.git/' \
              --exclude='.github/workflows/' \
              --exclude='everthread-patch.json' \
              "$IMPORT_DIR/" ./

            # Optional explicit deletions are supported without using rsync --delete.
            python3 - "$IMPORT_DIR/everthread-patch.json" <<'PY'
          import json, pathlib, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          root = pathlib.Path.cwd().resolve()
          for raw in manifest.get("delete", []):
              rel = pathlib.PurePosixPath(str(raw))
              if rel.is_absolute() or ".." in rel.parts or str(rel).startswith(".github/workflows/"):
                  raise SystemExit(f"Unsafe delete path in Everthread patch: {raw}")
              target = (root / pathlib.Path(*rel.parts)).resolve()
              if root not in target.parents and target != root:
                  raise SystemExit(f"Delete path escapes repository: {raw}")
              if target.is_dir():
                  import shutil
                  shutil.rmtree(target)
              elif target.exists() or target.is_symlink():
                  target.unlink()
          PY

            rm -rf "$IMPORT_DIR"
            rm -f everthread-source.zip

            if [ ! -f package.json ]; then
              echo "Everthread package.json is missing after overlay import."
              exit 1
            fi

            git config user.name "everthread-build-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Import Everthread source overlay [skip ci]"
              if ! git push; then
                echo "Warning: GitHub did not allow the workflow to push the expanded source. Continuing with the playable build anyway."
              fi
            fi
          fi

          if [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No Everthread source is present yet."
          fi

      - name: Set up Node
        if: steps.source.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bootstrap dependency lock once
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json is missing; creating the initial deterministic dependency lock."
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git config user.name "everthread-build-bot"
            git config user.email "actions@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lock Everthread dependencies [skip ci]"
            git push
          fi

      - name: Install locked dependencies
        if: steps.source.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      - name: Run canonical Everthread preflight
        if: steps.source.outputs.ready == 'true'
        run: npm run preflight

      - name: Upload failed preflight evidence
        if: failure() && steps.source.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: everthread-preflight-failure-${{ github.run_id }}
          path: .everthread/preflight-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare certified source baseline
        if: steps.source.outputs.ready == 'true'
        id: certified
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED_COMMIT="$(git rev-parse HEAD)"
          CERT_DIR="$RUNNER_TEMP/everthread-certified-source"
          rm -rf "$CERT_DIR"
          mkdir -p "$CERT_DIR"

          ARCHIVE="$CERT_DIR/everthread-certified-source.tar.gz"
          git archive --format=tar.gz --output="$ARCHIVE" "$VERIFIED_COMMIT"
          cp .everthread/preflight-report.json "$CERT_DIR/preflight-report.json"
          ARCHIVE_SHA="$(sha256sum "$ARCHIVE" | awk '{print $1}')"

          python3 - "$CERT_DIR/certified-source.json" "$VERIFIED_COMMIT" "$ARCHIVE_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" <<'PY'
          import json, pathlib, sys
          output, commit, archive_sha, repository, run_id = sys.argv[1:]
          payload = {
              "format": 1,
              "product": "Everthread",
              "repository": repository,
              "verifiedCommit": commit,
              "archive": "everthread-certified-source.tar.gz",
              "archiveSha256": archive_sha,
              "preflightReport": "preflight-report.json",
              "nodeMajor": 22,
              "workflowRunId": int(run_id),
          }
          pathlib.Path(output).write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

          echo "commit=$VERIFIED_COMMIT" >> "$GITHUB_OUTPUT"
          echo "dir=$CERT_DIR" >> "$GITHUB_OUTPUT"
          echo "archive_sha=$ARCHIVE_SHA" >> "$GITHUB_OUTPUT"
          echo "Certified source commit: $VERIFIED_COMMIT"
          echo "Certified source archive SHA-256: $ARCHIVE_SHA"

      - name: Upload certified source baseline
        if: steps.source.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: everthread-certified-source-${{ steps.certified.outputs.commit }}
          path: ${{ steps.certified.outputs.dir }}
          if-no-files-found: error
          retention-days: 90

      - name: Configure GitHub Pages
        if: steps.source.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.source.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy Everthread
        if: steps.source.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
