name: Everthread mobile build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: everthread-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import an uploaded Everthread source bundle
        id: source
        shell: bash
        run: |
          set -euo pipefail

          if [ -f everthread-source.zip ]; then
            echo "Everthread source bundle found. Importing it..."
            rm -rf .everthread-import
            mkdir .everthread-import
            unzip -q everthread-source.zip -d .everthread-import

            if [ ! -f .everthread-import/package.json ]; then
              echo "The uploaded ZIP is not an Everthread source bundle: package.json is missing."
              exit 1
            fi

            # Keep this workflow in place while replacing the game source.
            rsync -a --delete \
              --exclude='.git/' \
              --exclude='.github/workflows/' \
              .everthread-import/ ./

            rm -rf .everthread-import
            rm -f everthread-source.zip

            git config user.name "everthread-build-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Import Everthread mobile source bundle"
              if ! git push; then
                echo "Warning: GitHub did not allow the workflow to push the expanded source. Continuing with the playable build anyway."
              fi
            fi
          fi

          if [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No Everthread source is present yet. Upload everthread-source.zip to continue."
          fi

      - name: Set up Node
        if: steps.source.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.source.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Type-check engine and tests
        if: steps.source.outputs.ready == 'true'
        run: |
          npm run typecheck:engine
          npm run typecheck:tests

      - name: Run regression suite
        if: steps.source.outputs.ready == 'true'
        run: npm test

      - name: Build Everthread
        if: steps.source.outputs.ready == 'true'
        run: npm run build

      - name: Configure GitHub Pages
        if: steps.source.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.source.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy Everthread
        if: steps.source.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
